name: CI

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - if: runner.os == 'Windows'
        run: cargo test -p camrtsp-capture -- --ignored encodes_synthetic_nv12_with_the_software_mft

  package-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: x86_64-pc-windows-msvc
      - shell: pwsh
        env:
          CAMRTSP_CERTIFICATE_THUMBPRINT: ${{ secrets.CAMRTSP_CERTIFICATE_THUMBPRINT }}
          CAMRTSP_TIMESTAMP_URL: ${{ secrets.CAMRTSP_TIMESTAMP_URL }}
        run: ./scripts/package-windows.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')
      - uses: actions/upload-artifact@v4
        with:
          name: camrtsp-windows-x64
          path: dist/*

  package-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: camrtsp-macos
          path: dist/*
