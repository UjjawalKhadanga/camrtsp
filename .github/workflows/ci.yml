name: CI

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - if: runner.os == 'Windows'
        run: cargo test -p camrtsp-capture -- --ignored encodes_synthetic_nv12_with_the_software_mft

  package-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: x86_64-pc-windows-msvc
      - shell: pwsh
        env:
          CAMRTSP_CERTIFICATE_THUMBPRINT: ${{ secrets.CAMRTSP_CERTIFICATE_THUMBPRINT }}
          CAMRTSP_TIMESTAMP_URL: ${{ secrets.CAMRTSP_TIMESTAMP_URL }}
        run: ./scripts/package-windows.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')
      - uses: actions/upload-artifact@v4
        with:
          name: camrtsp-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256

  package-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: camrtsp-macos
          path: |
            dist/*.tar.gz
            dist/*.sha256

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - run: ./scripts/build-android.sh
      - working-directory: apps/android
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest
      - run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk dist/camrtsp-android-debug.apk
          cd dist
          sha256sum camrtsp-android-debug.apk > camrtsp-android-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: camrtsp-android-debug
          path: dist/*

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-windows, package-macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: camrtsp-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          files: dist/*
          body: |
            Native camera-to-RTSP beta. See README and CHANGELOG for supported platforms and hardware validation limits.
            The Android APK is a debug build signed with an ephemeral CI debug key, for evaluation only.
            It may require uninstalling a previous debug build before installation. Stable Android distribution requires a persistent release signing key.
            macOS uses ad-hoc signing unless a signing identity is configured; notarization is not provided by this workflow.
