[workspace]
members = [
  "crates/camrtsp-core",
  "crates/camrtsp-capture",
  "crates/camrtsp-codec",
  "crates/camrtsp-rtp",
  "crates/camrtsp-server",
  "crates/camrtsp-android",
  "apps/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util", "signal"] }
tokio-util = "0.7"
jni = "0.21"
once_cell = "1.21"
windows = "0.62"
windows-core = "0.62"
camrtsp-core = { path = "crates/camrtsp-core" }
camrtsp-capture = { path = "crates/camrtsp-capture" }
camrtsp-codec = { path = "crates/camrtsp-codec" }
camrtsp-rtp = { path = "crates/camrtsp-rtp" }
camrtsp-server = { path = "crates/camrtsp-server" }
